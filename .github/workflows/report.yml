name: Publish report

on:
  push:
    branches: [master]      # only AFTER a merge into master
  workflow_dispatch:        # manual button

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - run: python run_models.py            # run the SQL
      - uses: actions/upload-artifact@v4     # CSVs to download
        with:
          name: sales-report
          path: output/
