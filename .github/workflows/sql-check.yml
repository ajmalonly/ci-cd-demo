name: SQL check

on:
  push:
    branches: [master]
  pull_request:                # every PR gets checked

jobs:
  lint:
    runs-on: ubuntu-latest     # a fresh Linux machine
    steps:
      - uses: actions/checkout@v4          # copy the repo onto it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff
      - run: sqlfluff lint models/         # fails = red cross
